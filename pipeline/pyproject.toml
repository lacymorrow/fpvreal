[project]
name = "fpvreal-scene"
version = "0.1.0"
description = "Turn an FPV video into a flyable FPV Real scene: frames, COLMAP poses, a Brush splat, a collision mesh."
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "plyfile>=1.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "fast-simplification>=0.1.9",
]

[project.scripts]
fpvreal-scene = "fpvreal_scene.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpvreal_scene"]
