# Packaging the installed app (issue #259, slice T2).
#
# Windows and Linux only — macOS is explicitly out of scope (user decision,
# 2026-09-07). No code signing: without a certificate, Windows SmartScreen
# shows a warning on first launch, and that is accepted.
appId: com.lionrayonnant.fpvtp
copyright: FPVThePlanet!
# productName lives in package.json, not here: Electron reads it too, and it is
# what names the data directory (app.getName()). No "!" in it — it serves as a
# folder name and an installer filename; the displayed title stays the one in
# index.html.

directories:
  output: release
  buildResources: electron/build

# No spaces: these filenames travel through a download URL and a command line
# before they reach the player.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Production node_modules is copied automatically by electron-builder; these
# patterns only describe the rest of the repository, plus the exclusions.
files:
  - electron/**
  - server/**
  - tools/**
  # server/api.mjs -> add-map-core -> src/geofence.js: the map pipeline shares
  # its geometry with the game.
  - src/**
  - package.json
  - dist/**
  # `npm run build` copies all of public/ into dist/, scenes/ included (issue
  # #290): potentially several gigabytes of terrain. Scenes live in the
  # installation's data directory, never in the installer — a fresh install
  # starts with an empty catalogue, which is server/static.mjs's contract.
  - '!dist/scenes/**'
  - '!dist/scenes.json'
  # three, leaflet and geoman are only used by the renderer, where Vite has
  # already inlined them into dist/: shipping them a second time as sources
  # costs ~36 MB for nothing. Rapier and sharp stay: tools/prep.mjs loads them
  # on the Node side.
  - '!node_modules/three/**'
  - '!node_modules/leaflet/**'
  - '!node_modules/@geoman-io/**'

# sharp loads libvips through a native binding: it cannot be read from the asar
# archive.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

# The licence travels with the application. The AGPL requires it to accompany
# the distributed program; it lives at the repository root, one level above the
# build context (sim/), hence the relative path.
extraResources:
  - from: ../LICENSE
    to: LICENSE

win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/build/icon.png

nsis:
  # A real installer, not a portable executable: Start Menu entry, uninstaller,
  # choice of directory.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FPVThePlanet!

linux:
  # AppImage alone: the closest thing to "download and double-click". No .deb,
  # which would mean maintaining an APT repository.
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  icon: electron/build/icon.png
  # Otherwise the executable inherits package.json's `name` (fpvtp-sim).
  executableName: fpvtp

# The repository is public, so electron-updater reads the GitHub Releases API
# without a token and `provider: github` is the whole distribution: the release
# workflow attaches the installers and the latest*.yml feeds to the Release,
# and the updater reads them straight from there. No server to run.
#
# owner/repo are explicit rather than inferred: electron-builder derives them
# from package.json's `repository` field or from the git remote, and a CI
# checkout is exactly where that inference is most likely to surprise.
#
# A self-hosted feed stays possible without rebuilding: FPVTP_UPDATE_URL
# overrides the baked feed at runtime (see electron/main.js).
publish:
  - provider: github
    owner: lionrayonnant
    repo: FPVThePlanet
    releaseType: release
